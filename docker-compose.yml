name: workos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workos}
      POSTGRES_DB: ${POSTGRES_DB:-workos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workos -d workos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workos}:${POSTGRES_PASSWORD:-workos}@db:5432/${POSTGRES_DB:-workos}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@workos.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      PUBLIC_REGISTER: ${PUBLIC_REGISTER:-false}
      PHONE_DEFAULT_COUNTRY: ${PHONE_DEFAULT_COUNTRY:-82}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      API_URL: http://api:8081
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_uploads:
